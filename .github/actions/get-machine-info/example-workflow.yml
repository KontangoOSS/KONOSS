# Example workflow showing how to use the get-machine-info action
name: Example - Get Machine Info

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # Example 1: Using action from GitHub (recommended)
  from-github:
    runs-on: ubuntu-latest
    steps:
      - name: Collect Machine Information
        id: machine
        uses: KontangoOSS/KONOSS/OPS/actions/get-machine-info@main
        with:
          config: machine-info.env

      - name: Display hostname
        run: |
          source machine-info.env
          echo "Running on host: $MACHINE_HOSTNAME"
          echo "IP Address: $MACHINE_IP"
          echo "CPU: $MACHINE_CPU_MODEL ($MACHINE_CPU_COUNT cores)"

      - name: Upload machine info
        uses: actions/upload-artifact@v4
        with:
          name: machine-info
          path: machine-info.env

  # Example 2: Using action from local repository
  from-local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect Machine Information
        id: machine
        uses: ./OPS/actions/get-machine-info
        with:
          config: machine-info.env

      - name: Display hostname
        run: |
          source machine-info.env
          echo "Running on host: $MACHINE_HOSTNAME"

  # Example 3: Chaining with other actions
  chained-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Collect Machine Info
        id: machine
        uses: KontangoOSS/KONOSS/OPS/actions/get-machine-info@main
        with:
          config: .env

      - name: Use in another action
        uses: KontangoOSS/KONOSS/OPS/actions/some-other-action@main
        with:
          config: ${{ steps.machine.outputs.config }}
