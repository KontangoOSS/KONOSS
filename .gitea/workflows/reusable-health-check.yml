name: Reusable KONOSS Health Check

on:
  workflow_call:
    inputs:
      custom-message:
        description: 'Custom health check message'
        required: false
        type: string
        default: 'KONOSS Platform is operational'
      show-system-info:
        description: 'Show system information'
        required: false
        type: boolean
        default: true
    outputs:
      status:
        description: 'Health check status'
        value: ${{ jobs.health-check.outputs.status }}
      timestamp:
        description: 'Timestamp of the check'
        value: ${{ jobs.health-check.outputs.timestamp }}

jobs:
  health-check:
    name: Platform Health Check
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.health.outputs.status }}
      timestamp: ${{ steps.health.outputs.timestamp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run KONOSS health check action
        id: health
        uses: ./.gitea/actions/health-check
        with:
          message: ${{ inputs.custom-message }}
          show-system-info: ${{ inputs.show-system-info }}

      - name: Generate detailed summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Workflow Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Workflow Context:"
          echo "  • Repository: ${{ github.repository }}"
          echo "  • Branch: ${{ github.ref_name }}"
          echo "  • Triggered by: ${{ github.actor }}"
          echo "  • Event: ${{ github.event_name }}"
          echo ""
          echo "Health Check Results:"
          echo "  • Status: ${{ steps.health.outputs.status }}"
          echo "  • Timestamp: ${{ steps.health.outputs.timestamp }}"
          echo ""

          # Determine overall status
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Overall Status: SUCCESS"
          else
            echo "❌ Overall Status: FAILED"
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
