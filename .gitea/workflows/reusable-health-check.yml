name: Reusable KONOSS Health Check

on:
  workflow_call:
    inputs:
      custom-message:
        description: 'Custom health check message'
        required: false
        type: string
        default: 'KONOSS Platform is operational'
      show-system-info:
        description: 'Show system information'
        required: false
        type: boolean
        default: true
    outputs:
      status:
        description: 'Health check status'
        value: ${{ jobs.health-check.outputs.status }}
      timestamp:
        description: 'Timestamp of the check'
        value: ${{ jobs.health-check.outputs.timestamp }}

jobs:
  health-check:
    name: Platform Health Check
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.health.outputs.status }}
      timestamp: ${{ steps.health.outputs.timestamp }}

    steps:
      - name: Display welcome banner
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║                                                                   ║"
          echo "║   ██╗  ██╗ ██████╗ ███╗   ██╗ ██████╗ ███████╗███████╗          ║"
          echo "║   ██║ ██╔╝██╔═══██╗████╗  ██║██╔═══██╗██╔════╝██╔════╝          ║"
          echo "║   █████╔╝ ██║   ██║██╔██╗ ██║██║   ██║███████╗███████╗          ║"
          echo "║   ██╔═██╗ ██║   ██║██║╚██╗██║██║   ██║╚════██║╚════██║          ║"
          echo "║   ██║  ██╗╚██████╔╝██║ ╚████║╚██████╔╝███████║███████║          ║"
          echo "║   ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═══╝ ╚═════╝ ╚══════╝╚══════╝          ║"
          echo "║                                                                   ║"
          echo "║              🚀 Reusable Health Check Workflow 🚀                ║"
          echo "║                                                                   ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo ""

          # Fun loading animation
          echo "⏳ Initializing workflow..."
          for i in {1..3}; do
            echo -n "."
            sleep 0.5
          done
          echo " Done! ✨"
          echo ""

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Log checkout completion
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📥 Repository Checkout Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Repository Information:"
          echo "  ├─ Repository: ${{ github.repository }}"
          echo "  ├─ Branch: ${{ github.ref_name }}"
          echo "  ├─ Commit: ${{ github.sha }}"
          echo "  └─ Fetch Depth: 1"
          echo ""

          # Fun fact generator
          FACTS=(
            "🎲 Fun Fact: The first computer bug was an actual bug (a moth)!"
            "🎲 Fun Fact: There are more possible iterations of a game of chess than atoms in the known universe!"
            "🎲 Fun Fact: The first 1GB hard drive weighed over 500 pounds!"
            "🎲 Fun Fact: The average person blinks 15-20 times per minute!"
            "🎲 Fun Fact: Honey never spoils. Archaeologists found 3000-year-old honey in Egyptian tombs!"
          )
          RANDOM_FACT=${FACTS[$RANDOM % ${#FACTS[@]}]}
          echo "$RANDOM_FACT"
          echo ""

      - name: Run KONOSS health check action
        id: health
        uses: ./.gitea/actions/health-check
        with:
          message: ${{ inputs.custom-message }}
          show-system-info: ${{ inputs.show-system-info }}

      - name: Display action outputs
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📤 Health Check Action Outputs"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Outputs:"
          echo "  ├─ Status: ${{ steps.health.outputs.status }}"
          echo "  └─ Timestamp: ${{ steps.health.outputs.timestamp }}"
          echo ""
          echo "Inputs:"
          echo "  ├─ Message: ${{ inputs.custom-message }}"
          echo "  └─ Show System Info: ${{ inputs.show-system-info }}"
          echo ""

      - name: Generate random quote
        run: |
          QUOTES=(
            "\"The only way to do great work is to love what you do.\" - Steve Jobs"
            "\"Code is like humor. When you have to explain it, it's bad.\" - Cory House"
            "\"First, solve the problem. Then, write the code.\" - John Johnson"
            "\"Simplicity is the soul of efficiency.\" - Austin Freeman"
            "\"Make it work, make it right, make it fast.\" - Kent Beck"
            "\"Programs must be written for people to read, and only incidentally for machines to execute.\" - Harold Abelson"
          )
          RANDOM_QUOTE=${QUOTES[$RANDOM % ${#QUOTES[@]}]}
          echo ""
          echo "💭 Inspirational Quote:"
          echo "   $RANDOM_QUOTE"
          echo ""

      - name: Workflow summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Reusable Workflow Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Context:"
          echo "  ├─ Workflow: ${{ github.workflow }}"
          echo "  ├─ Run #: ${{ github.run_number }}"
          echo "  ├─ Triggered By: ${{ github.actor }}"
          echo "  └─ Event: ${{ github.event_name }}"
          echo ""
          echo "Result:"

          if [ "${{ job.status }}" = "success" ]; then
            echo "  └─ Status: ✅ SUCCESS"
            echo ""
            # Success celebration
            echo "    🎉 🎊 🥳 CELEBRATION TIME! 🥳 🎊 🎉"
            echo ""
            echo "         ✨  ✨  ✨"
            echo "       ✨  🏆  ✨"
            echo "         ✨  ✨  ✨"
            echo ""
          else
            echo "  └─ Status: ❌ FAILED"
            echo ""
            echo "    😢 Don't worry, bugs are just features in disguise!"
          fi

          echo ""

          # Progress bar visualization
          echo "📊 Workflow Progress:"
          echo "  [████████████████████] 100%"
          echo ""

          # Execution time estimate
          END_TIME=$(date +%s)
          echo "⏱️  Execution Stats:"
          echo "  └─ Completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo ""

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "       ╔═══════════════════════════════════════╗"
          echo "       ║   🎯 KONOSS Platform | konoss.org   ║"
          echo "       ║   Made with ❤️  and lots of ☕       ║"
          echo "       ╚═══════════════════════════════════════╝"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
