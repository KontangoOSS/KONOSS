# Example workflow showing how to use the get-machine-info action
name: Example - Get Machine Info

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  collect-machine-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Example 1: Basic usage - collect and save to file
      - name: Collect Machine Information
        id: machine
        uses: ./actions/get-machine-info
        with:
          config: machine-info.env

      # Example 2: Use collected info in subsequent steps
      - name: Display hostname
        run: |
          source machine-info.env
          echo "Running on host: $MACHINE_HOSTNAME"
          echo "IP Address: $MACHINE_IP"
          echo "CPU: $MACHINE_CPU_MODEL ($MACHINE_CPU_COUNT cores)"

      # Example 3: Chain with another action
      - name: Use in another action
        uses: ./actions/some-other-action
        with:
          config: ${{ steps.machine.outputs.config }}

      # Example 4: Upload as artifact
      - name: Upload machine info
        uses: actions/upload-artifact@v4
        with:
          name: machine-info
          path: machine-info.env
